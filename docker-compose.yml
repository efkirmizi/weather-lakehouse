services:
  # 1. THE STORAGE LAYER
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # console
    environment:
      MINIO_ROOT_USER: ${MINIO_ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ADMIN_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 1b. ONE-SHOT BUCKET BOOTSTRAP
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      if [ -z '${MINIO_APP_USER:-}' ] && [ -n '${MINIO_APP_PASSWORD:-}' ]; then
        echo 'MINIO_APP_PASSWORD is set but MINIO_APP_USER is empty - every service would authenticate with a mismatched pair.' >&2; exit 1;
      fi &&
      if [ -n '${MINIO_APP_USER:-}' ] && [ -z '${MINIO_APP_PASSWORD:-}' ]; then
        echo 'MINIO_APP_USER is set but MINIO_APP_PASSWORD is empty - set both or neither.' >&2; exit 1;
      fi &&
      mc alias set local http://minio:9000 '${MINIO_ADMIN_USER}' '${MINIO_ADMIN_PASSWORD}' &&
      mc mb --ignore-existing local/warehouse &&
      mc mb --ignore-existing local/mlflow &&
      if [ '${MINIO_APP_USER:-${MINIO_ADMIN_USER}}' != '${MINIO_ADMIN_USER}' ]; then
        mc admin user add local '${MINIO_APP_USER:-${MINIO_ADMIN_USER}}' '${MINIO_APP_PASSWORD:-${MINIO_ADMIN_PASSWORD}}' &&
        mc admin policy attach local readwrite --user '${MINIO_APP_USER:-${MINIO_ADMIN_USER}}' || true;
      fi &&
      echo 'buckets ready'
      "
    restart: "no"

  # 2. THE CATALOG BACKEND (Isolated Nessie DB)
  postgres-nessie:
    image: postgres:18
    container_name: postgres-nessie
    environment:
      POSTGRES_DB: ${NESSIE_DB_NAME}
      POSTGRES_USER: ${NESSIE_DB_USER}
      POSTGRES_PASSWORD: ${NESSIE_DB_PASSWORD}
    volumes:
      - postgres_nessie_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NESSIE_DB_USER} -d ${NESSIE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 3. THE CATALOG ENGINE
  nessie:
    image: ghcr.io/projectnessie/nessie:0.108.4
    container_name: nessie
    ports:
      - "19120:19120"
      - "9010:9000"
    depends_on:
      postgres-nessie:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      nessie.version.store.type: JDBC2
      nessie.version.store.persist.jdbc.datasource: postgresql
      quarkus.datasource.postgresql.jdbc.url: jdbc:postgresql://postgres-nessie:5432/${NESSIE_DB_NAME}
      quarkus.datasource.postgresql.username: ${NESSIE_DB_USER}
      quarkus.datasource.postgresql.password: ${NESSIE_DB_PASSWORD}
      nessie.catalog.default-warehouse: warehouse
      nessie.catalog.warehouses.warehouse.location: s3://warehouse/
      nessie.catalog.service.s3.default-options.endpoint: http://minio:9000/
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.auth-type: STATIC
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      nessie.catalog.secrets.access-key.name: ${MINIO_APP_USER:-${MINIO_ADMIN_USER}}
      nessie.catalog.secrets.access-key.secret: ${MINIO_APP_PASSWORD:-${MINIO_ADMIN_PASSWORD}}
      nessie.server.authentication.enabled: "false"
    restart: unless-stopped

  # 4. THE ORCHESTRATION BACKEND (Isolated Airflow DB)
  postgres-airflow:
    image: postgres:18
    container_name: postgres-airflow
    environment:
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - postgres_airflow_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 5. THE ORCHESTRATOR INIT
  airflow-init:
    build:
      context: ./docker/airflow
    container_name: airflow-init
    user: "0:0" # Temporarily run as root to fix host permissions
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow:5432/${AIRFLOW_DB_NAME}
      # Encrypts connection passwords at rest. Left empty Airflow still works, it just
      # stores them in clear text - generate one with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    command:
      - bash
      - -c
      - |
        mkdir -p /opt/airflow/dags /opt/airflow/logs
        chown -R 50000:0 /opt/airflow/dags /opt/airflow/logs
        
        # Switch to airflow user for all database and CLI commands
        su airflow -c "
          airflow db migrate &&
          airflow users create --username ${_AIRFLOW_WWW_USER_USERNAME} --password ${_AIRFLOW_WWW_USER_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.com || true &&
          airflow pools set single_gpu 1 'Serializes GPU work: this host has one GPU and every GPU task requests all of them' &&
          airflow connections delete minio_s3 2>/dev/null || true &&
          airflow connections add minio_s3 --conn-type generic --conn-login '${MINIO_APP_USER:-${MINIO_ADMIN_USER}}' --conn-password '${MINIO_APP_PASSWORD:-${MINIO_ADMIN_PASSWORD}}' --conn-description 'S3 credentials the DockerOperator jobs receive as AWS_* env vars'
        "

  # 6. THE ORCHESTRATOR COMPONENTS
  airflow-webserver:
    build:
      context: ./docker/airflow
    container_name: airflow-webserver
    user: "50000:0"
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build:
      context: ./docker/airflow
    container_name: airflow-scheduler
    user: "50000:0"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      # The S3 keys are no longer here: jobs receive them from the minio_s3 Airflow
      # connection, rendered per task run (see dags/credentials.py).
      # Passed through to the drift monitor container so it can trigger retraining
      # without a credential hardcoded in the job source.
      AIRFLOW_API_USER: ${_AIRFLOW_WWW_USER_USERNAME}
      AIRFLOW_API_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    group_add:
      - "${DOCKER_GID}"
    
  # 7. THE MLOPS TRACKING SERVER
  mlflow:
    build:
      context: ./docker/mlflow
    container_name: mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_APP_USER:-${MINIO_ADMIN_USER}}
      - AWS_SECRET_ACCESS_KEY=${MINIO_APP_PASSWORD:-${MINIO_ADMIN_PASSWORD}}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://mlflow/
      --allowed-hosts '*'
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    
  # 8. FASTAPI BACKEND STREAMLIT FRONTEND DASHBOARD
  lakehouse-serving:
    build: 
      context: ./jobs/serving
      dockerfile: Dockerfile
    container_name: lakehouse_serving_ui
    restart: unless-stopped
    ports:
      - "8000:8000"   # FastAPI Backend
      - "8501:8501"   # Streamlit Frontend
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_APP_USER:-${MINIO_ADMIN_USER}}
      - AWS_SECRET_ACCESS_KEY=${MINIO_APP_PASSWORD:-${MINIO_ADMIN_PASSWORD}}
      - API_URL=http://localhost:8000
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  minio_data:
  postgres_nessie_data:
  postgres_airflow_data:
  mlflow_data:

networks:
  default:
    name: lakehouse-net